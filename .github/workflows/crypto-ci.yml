name: Crypto scan difference

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current revision
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Run typecheck
        run: npm run typecheck
      - name: Scan current revision
        run: npm run --silent scan -- . > current-scan.json

      - name: Check out comparison revision
        if: ${{ github.event_name == 'pull_request' || (github.event.before && github.event.before != '0000000000000000000000000000000000000000') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .baseline
      - name: Scan comparison revision
        if: ${{ github.event_name == 'pull_request' || (github.event.before && github.event.before != '0000000000000000000000000000000000000000') }}
        run: npm run --silent scan -- .baseline > baseline-scan.json

      - name: Compare findings
        id: diff
        run: node scripts/scan-diff.mjs current-scan.json baseline-scan.json
      - name: Comment on same-repository PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.diff.outputs.changes != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync('scan-diff.md', 'utf8'),
            });
      - name: Gate new high-severity config and protocol references
        if: ${{ steps.diff.outputs.blocked == 'true' }}
        run: |
          echo 'New high-severity config or protocol references need review; see the scan summary.'
          exit 1
